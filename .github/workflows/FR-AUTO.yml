name: Auto Update ✪ FR-AUTO

on:
  schedule:
  - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-bein:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Requests
        run: pip install requests

      - name: Run FR-AUTO Script
        run: python3 FR-AUTO.py

      - name: Commit & Push updated M3U
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          git add channels/FR-AUTO.m3u8
          git commit -m "Update FR-AUTO.m3u8 [ci skip]" || echo "No changes"
          git push
