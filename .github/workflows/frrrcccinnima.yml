name: Auto Update ✪ frrrcccinnima M3U

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Generate M3U
        run: python frrrcccinnima.py

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if [ -f frrrcccinnima.m3u ]; then
            git add frrrcccinnima.m3u
            git commit -m "Auto update frrrcccinnima.m3u" || echo "No changes to commit"
            git pull --rebase
            git push
          else
            echo "frrrcccinnima.m3u does not exist, skipping commit."
          fi
